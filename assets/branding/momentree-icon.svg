<svg width="1024" height="1024" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#1f6b45" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#101614" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leafTop" cx="40%" cy="35%" r="60%">
