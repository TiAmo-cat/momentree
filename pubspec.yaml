name: momentree
description: "A habit and urge tracker that turns daily self-discipline into tree growth."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  sqflite: ^2.3.3+1
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  google_mobile_ads: ^6.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
